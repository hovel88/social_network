scope: patroni-cluster
name: pg_patroni2

log:
  format: '%(asctime)s %(levelname)s: %(message)s'
  level: INFO
  max_queue_size: 1000
  traceback_level: ERROR

restapi:
  connect_address: pg_patroni2:8008
  listen: pg_patroni2:8008

etcd:
  hosts: etcd0:2379,etcd1:2379,etcd2:2379

postgresql:
  connect_address: pg_patroni2:5432
  listen: pg_patroni2:5432
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass
  authentication:
    superuser:
      username: postgres
      password: pgpass
    replication:
      username: replicator
      password: rpass

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false

# The bootstrap configuration. Works only when the cluster is not yet initialized.
# If the cluster is already initialized, all changes in the `bootstrap` section are ignored!
bootstrap:
  # This section will be written into Etcd:/<namespace>/<scope>/config after initializing
  # new cluster and all other cluster members will use it as a `global configuration`.
  # WARNING! If you want to change any of the parameters that were set up
  # via `bootstrap.dcs` section, please use `patronictl edit-config`!
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        hot_standby: "on"
        ssl: "off"
        wal_level: replica
        wal_log_hints: "on"
        wal_keep_size: 128MB
        logging_collector: "on"
        restart_after_crash: "off"
        max_wal_senders: 5
        max_replication_slots: 5
        max_worker_processes: 8
        max_locks_per_transaction: 64
        max_connections: 100
        tcp_keepalives_idle: 60
        tcp_keepalives_interval: 10
        tcp_keepalives_count: 10

  pg_hba:
  - host replication replicator 192.168.1.1/24 md5
  - host replication replicator 127.0.0.1/32 trust
  - host replication replicator 172.21.0.0/16 md5
  - host all all 192.168.1.1/24 md5
  - host all all 0.0.0.0/0 md5

  initdb:
  - encoding: UTF8
  - data-checksums

  # Some additional users users which needs to be created after initializing new cluster
  # users:
  #   admin:
  #     password: admin
  #     options:
  #       - createrole
  #       - createdb
