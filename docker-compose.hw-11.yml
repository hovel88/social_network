networks:
  net:
    driver: bridge
  # test:
  #   external: true  # не забыть объявить до запуска скрипта

volumes:
  zabbix-storage:
  prometheus-storage:
  grafana-storage:

services:

# -------------------------------------
# система мониторинга USE метрик (Zabbix)
# -------------------------------------
  zabbix_db:
    image: postgres:15-alpine
    container_name: "zabbix_db"
    hostname: "zabbix_db"
    restart: unless-stopped
    networks:
      - net
    volumes:
      - zabbix-storage:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix


  zabbix_srv:
    image: zabbix/zabbix-server-pgsql:7.2.11-alpine
    container_name: "zabbix_srv"
    hostname: "zabbix_srv"
    restart: unless-stopped
    depends_on:
      - zabbix_db
    networks:
      - net
    ports:
      - 10051:10051
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_SERVER_HOST=zabbix_db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix


  zabbix_web:
    image: zabbix/zabbix-web-nginx-pgsql:7.2.11-alpine
    container_name: "zabbix_web"
    hostname: "zabbix_web"
    restart: unless-stopped
    depends_on:
      - zabbix_db
      - zabbix_srv
    networks:
      - net
    ports:
      - 8080:8080
    environment:
      - DB_SERVER_HOST=zabbix_db
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix_srv


  zabbix_agent:
    image: zabbix/zabbix-agent2:7.2.11-alpine
    container_name: "zabbix_agent"
    hostname: "zabbix_agent"
    restart: unless-stopped
    user: root
    privileged: true
    depends_on:
      - zabbix_srv
    networks:
      - net
    ports:
      - 10050:10050
    environment:
      - ZBX_SERVER_HOST=zabbix_srv
      - ZBX_DEBUGLEVEL=4
      - ZBX_LISTENPORT=10050
      - ZBX_HOSTNAME=social-network-host # по умолчанию используется hostname контейнера
    volumes:
      - ./monitoring/hw11/zabbix/agent2.conf:/etc/zabbix/zabbix_agent2.d/agent2.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro

# -------------------------------------
# система мониторинга RED метрик (Prometheus + Grafana)
# -------------------------------------

  prometheus_srv:
    image: prom/prometheus:v2.37.9
    container_name: "prometheus_srv"
    hostname: "prometheus_srv"
    restart: unless-stopped
    networks:
      - net
    ports:
      - 9090:9090
      # - 9091:9091 # Pushgateway
      # - 9093:9093 # Alertmanager
      # - 9094:9094 # Alertmanager clustering
      # - 9100:9100 # Prometheus Exporters (9100-9563)
    volumes:
      - ./monitoring/hw11/prometheus:/etc/prometheus
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--enable-feature=promql-experimental-functions'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver' # Enables remote write endpoint for k6


  grafana_srv:
    image: grafana/grafana:latest
    container_name: "grafana_srv"
    hostname: "grafana_srv"
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    depends_on:
      - zabbix_srv
      - prometheus_srv
    networks:
      - net
    ports:
      - 3000:3000
    volumes:
      - ./monitoring/hw11/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/hw11/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-storage:/var/lib/grafana

# -------------------------------------
# дополнительный контейнеры для предоставления информации
# -------------------------------------

  node_exporter:
    image: prom/node-exporter:latest
    container_name: "node_exporter"
    hostname: "node_exporter"
    restart: unless-stopped
    depends_on:
      - prometheus_srv
    networks:
      - net
    expose:
      - 9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'


  cadvisor:
    image: google/cadvisor:latest
    container_name: "cadvisor"
    hostname: "cadvisor"
    restart: unless-stopped
    privileged: true
    depends_on:
      - prometheus_srv
    networks:
      - net
    expose:
      - 8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg

# -------------------------------------
# сервисы и поддерживающая инфраструктура
# -------------------------------------

  social_srv:
    image: ${ENV_SOCIAL_SERVICE_IMAGE}
    container_name: "social_srv"
    hostname: "social_srv"
    restart: unless-stopped       # always, on-failure, unless-stopped, no (by default)
    depends_on:
      postgres_db:
        condition: service_healthy
      tarantool_db:
        condition: service_started
      chat_srv:
        condition: service_started
    environment:
      - PGSQL_MASTER_URL=postgresql://${ENV_POSTGRES_USER}:${ENV_POSTGRES_PASSWORD}@postgres_db:5432/postgres
      # - PGSQL_REPLICA_URL=postgresql://${ENV_POSTGRES_USER}:${ENV_POSTGRES_PASSWORD}@postgres_db:5432/postgres
      - GRPC_URL=grpc://chat_srv:50051
      - KAFKA_URL=tcp://kafka:9092
      - HTTP_LISTENING=0.0.0.0:6000
      - HTTP_QUEUE_CAPACITY=4096
      - HTTP_THREADS_COUNT=1
      - PROMETHEUS_PORT=6001
    networks:
      - net
    ports:
      - ${ENV_SOCIAL_HTTP_EXTERNAL_PORT}:6000
      # - ${ENV_SOCIAL_PROM_EXTERNAL_PORT}:6001   # для метрик Prometheus


  chat_srv:
    image: ${ENV_CHAT_SERVICE_IMAGE}
    container_name: "chat_srv"
    hostname: "chat_srv"
    restart: unless-stopped       # always, on-failure, unless-stopped, no (by default)
    depends_on:
      postgres_db:
        condition: service_healthy
      tarantool_db:
        condition: service_started
    environment:
      - TARANTOOL_URL=tcp://tntuser:tntpass@tarantool_db:3301
      - GRPC_LISTENING=0.0.0.0:50051
      - HTTP_LISTENING=0.0.0.0:6000
      - HTTP_QUEUE_CAPACITY=4096
      - HTTP_THREADS_COUNT=1
      - PROMETHEUS_PORT=6001
    networks:
      - net
    ports:
      - ${ENV_CHAT_HTTP_EXTERNAL_PORT}:6000
      # - ${ENV_CHAT_PROM_EXTERNAL_PORT}:6001   # для метрик Prometheus


  ws_srv:
    image: ${ENV_WS_SERVICE_IMAGE}
    container_name: "ws_srv"
    hostname: "ws_srv"
    restart: unless-stopped       # always, on-failure, unless-stopped, no (by default)
    depends_on:
      - kafka
    environment:
      - KAFKA_URL=tcp://kafka:9092
      - HTTP_LISTENING=0.0.0.0:6000
      - HTTP_QUEUE_CAPACITY=4096
      - HTTP_THREADS_COUNT=1
      - PROMETHEUS_PORT=6001
    networks:
      - net
    ports:
      - ${ENV_WS_HTTP_EXTERNAL_PORT}:6000
      # - ${ENV_WS_PROM_EXTERNAL_PORT}:6001   # для метрик Prometheus


  kafka:
    image: bitnami/kafka:3.9.0
    container_name: "kafka"
    hostname: "kafka"
    restart: unless-stopped
    environment:
      # KRaft
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Config parameters
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=10
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_RETENTION_MS=604800000
      - KAFKA_CFG_BACKGROUND_THREADS=3
    networks:
      - net
    ports:
      - 9092:9092


  kafka_ui:
    image: provectuslabs/kafka-ui:v0.4.0
    container_name: "kafka_ui"
    hostname: "kafka_ui"
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_NAME=kraft
    networks:
      - net
    ports:
      - 8090:8080


  postgres_db:
    image: postgres:16-alpine
    container_name: "postgres_db"
    hostname: "postgres_db"
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${ENV_POSTGRES_PASSWORD}
    volumes:
      - ./postgresql/single:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - net
    ports:
      - 15432:5432


  tarantool_db:
    build:
      context: ./tarantool/
      dockerfile: Dockerfile
    container_name: "tarantool_db"
    hostname: "tarantool_db"
    restart: unless-stopped
    volumes:
      - ./tarantool/scripts:/opt/tarantool
    networks:
      - net
    ports:
      - 3301:3301
      - 8081:8081 # админка
    command: tarantool /opt/tarantool/udf.lua

# -------------------------------------
# тестирование
# -------------------------------------

  k6:
    image: grafana/k6
    container_name: "k6"
    hostname: "k6"
    # restart: always
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus_srv:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_STATS=p(95),p(99),min,max,count,sum
      - TEST_HOST=http://chat_srv:6000
    depends_on:
      - prometheus_srv
      - chat_srv
    networks:
      - net
    volumes:
      - ./k6_tests:/tests
    # command: run --verbose --out experimental-prometheus-rw --http-debug="full" /tests/user_search.js
